<svg width="1200" height="330" viewBox="0 0 1200 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Umang Kumar — Aspiring Data Analyst</title>
<desc id="desc">Animated data analytics themed GitHub profile header.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#071A2E"/>
    <stop offset="48%" stop-color="#0F4C81"/>
    <stop offset="100%" stop-color="#1F6FEB"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7DD3FC"/>
    <stop offset="100%" stop-color="#FFFFFF"/>
  </linearGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
  </pattern>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1200" height="330" rx="26" fill="url(#bg)"/>
<rect width="1200" height="330" rx="26" fill="url(#grid)"/>

<!-- decorative data panels -->
<g opacity=".18" fill="#FFFFFF">
  <rect x="60" y="55" width="120" height="8" rx="4"/>
  <rect x="60" y="78" width="82" height="8" rx="4"/>
  <rect x="60" y="101" width="102" height="8" rx="4"/>
  <rect x="1010" y="58" width="105" height="8" rx="4"/>
  <rect x="1040" y="81" width="75" height="8" rx="4"/>
  <rect x="1018" y="104" width="97" height="8" rx="4"/>
</g>

<!-- animated analytics chart -->
<g transform="translate(720 78)">
  <rect width="390" height="175" rx="18" fill="#071A2E" fill-opacity=".34" stroke="#FFFFFF" stroke-opacity=".14"/>
  <path d="M28 140H362M28 108H362M28 76H362M28 44H362" stroke="#FFFFFF" stroke-opacity=".09"/>
  <path d="M35 125 C78 119, 83 88, 123 98 S178 126, 214 85 S270 52, 300 70 S330 39, 355 48"
        fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round"
        stroke-dasharray="700" stroke-dashoffset="700" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="700" to="0" dur="2.6s" fill="freeze"/>
  </path>
  <g fill="#FFFFFF">
    <circle cx="123" cy="98" r="5"><animate attributeName="r" values="4;7;4" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="214" cy="85" r="5"><animate attributeName="r" values="4;7;4" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="70" r="5"><animate attributeName="r" values="4;7;4" dur="1.7s" repeatCount="indefinite"/></circle>
  </g>
  <text x="28" y="28" fill="#FFFFFF" fill-opacity=".72" font-family="Arial, sans-serif" font-size="12" font-weight="700">DATA INSIGHTS</text>
</g>

<!-- main title -->
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
  <text x="420" y="125" fill="#FFFFFF" font-size="52" font-weight="800" letter-spacing="2">UMANG KUMAR</text>
  <text x="420" y="165" fill="#D7EEFF" font-size="22" font-weight="700" letter-spacing="4">ASPIRING DATA ANALYST</text>
  <text x="420" y="205" fill="#FFFFFF" fill-opacity=".82" font-size="16">Python • SQL • Excel • Power BI • AWS</text>
</g>

<!-- animated floating data points -->
<g fill="#FFFFFF">
  <circle cx="205" cy="266" r="4" opacity=".65">
    <animate attributeName="cy" values="266;248;266" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="285" r="3" opacity=".5">
    <animate attributeName="cy" values="285;265;285" dur="3.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="610" cy="275" r="4" opacity=".55">
    <animate attributeName="cy" values="275;255;275" dur="3.2s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- bottom accent -->
<rect x="0" y="318" width="1200" height="12" rx="6" fill="#FFFFFF" fill-opacity=".12"/>
<rect x="70" y="318" width="260" height="12" rx="6" fill="#7DD3FC" fill-opacity=".8">
  <animate attributeName="width" values="260;430;260" dur="4s" repeatCount="indefinite"/>
</rect>
</svg>
